---
- name: mariadb role
  tags:
    - mariadb
  block:

  # install
  - ansible.builtin.import_tasks: mariadb-install.yml

  # service
  - name: Ensure MariaDB service is started and enabled
    ansible.builtin.systemd_service:
      name: mariadb.service
      state: started
      enabled: true

  - when: mariadb_root_pw != None
    block:

    # root pw
    - name: Set MariaDB root password
      ansible.mysql.mysql_user:
        name: root
        login_password: "{{ mariadb_root_pw }}"
        login_user: root
        login_unix_socket: /var/run/mysqld/mysqld.sock
        check_implicit_admin: true
        state: present

    # disallow remote root login
    - name: Disallow root login remotely
      loop:
      - "{{ ansible_facts['hostname'] }}"
      - "127.0.0.1"
      - "::1"
      ansible.mysql.mysql_user:
        name: root
        host: "{{ item }}"
        login_user: root
        login_password: "{{ mariadb_root_pw }}"
        state: absent

  # mysql databases
  - ansible.builtin.import_tasks: mariadb-databases.yml

  # mysql users
  - ansible.builtin.import_tasks: mariadb-users.yml