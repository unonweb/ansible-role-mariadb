---
- tags: [role-mariadb-config]
  block:

  # assert
  - name: Assertions for mariadb_config_overrides
    ansible.builtin.assert:
    loop: "{{ mariadb_config_overrides }}"
    that:
    - item.path is defined
    - item.config is defined

  - name: Template MariaDB override configuration
    ansible.builtin.template:
      src: mariadb-override.cnf.j2
      dest: "{{ __mariadb_config_overrides_dir }}/{{ mariadb_config_overrides_file }}"
      owner: root
      group: root
      mode: "0644"
      validate: "mariadbd --defaults-extra-file=%s --validate-config"
    notify: systemctl reload mariadb.service