---
- tags: [role-mariadb-config]
  block:

  # assert
  - name: Assertions for mariadb-config
    ansible.builtin.assert:
      that:
      - mariadb_config_overrides is not string
      - mariadb_config_overrides is iterable
      - mariadb_config_overrides is mapping

  - name: Template MariaDB override configuration
    become: true
    ansible.builtin.template:
      src: mariadb-override.cnf.j2
      dest: "{{ __mariadb_config_overrides_dir }}/{{ mariadb_config_overrides_file }}"
      owner: root
      group: root
      mode: "0644"
    notify: systemctl reload mariadb.service