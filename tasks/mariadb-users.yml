---
- tags: [role-mariadb-users]
  when: mariadb_users | length > 0
  block:

  # assert
  - name: Assertions for mariadb-users
    ansible.builtin.assert:
      that:
      - mariadb_root_pw != None

  # assert
  - name: Assertions for mariadb-users
    loop: "{{ mariadb_users }}"
    ansible.builtin.assert:
      that:
      - item.name != None
      - item.pw != None
      - item.priv != None

  # create users
  - name: Create users and grant privileges
    loop: "{{ mariadb_users }}"
    loop_control:
      loop_var: __mariadb_user
    no_log: true
    ansible.mysql.mysql_user:
      login_user: root
      login_password: "{{ mariadb_root_pw }}"
      name: "{{ __mariadb_user.name }}"
      password: "{{ __mariadb_user.pw }}"
      host: localhost
      priv: "{{ __mariadb_user.priv }}"
      state: "{{ __mariadb_user.state | default('present') }}"